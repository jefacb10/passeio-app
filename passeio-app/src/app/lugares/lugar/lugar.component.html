<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Novo Lugar</h2>
    <hr class="mb-4">
    <form id="lugarForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
        <div class="mb-4">
            <label for="nome" class="block text-gray-700 font-medium mb-2">Nome</label>
            <input type="text"
                    id="nome"
                    formControlName="nome" 
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500" 
                    placeholder="Ex. Restaurante Estrela, Praia do Pontal" 
                    name="nome" 
                    required/>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('nome')">
                Nome é obrigatório.
            </span>
        </div>
        <div class="mb-4">
            <label for="categoria" class="block text-gray-700 font-medium mb-2">Categoria</label>
            <select
                    id="categoria"
                    formControlName="categoria"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500"
                    name="categoria"
                    required>
                <option value="">Selecione uma categoria</option>
                <option *ngFor="let categoria of categorias" [value]="categoria.nome">
                    {{ categoria.nome }}
                </option>
            </select>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('categoria')">
                Categoria é obrigatória.
            </span>
        </div>
        <div class="mb-4">
            <label for="localizacao" class="block text-gray-700 font-medium mb-2">Localização</label>
            <input type="text"
                    id="localizacao"
                    formControlName="localizacao"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500"
                    placeholder="Ex. Rua das Flores, 123"
                    name="localizacao"
                    required/>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('localizacao')">
                Localização é obrigatória.
            </span>
        </div>
        <div class="mb-4">
            <label for="urlFoto" class="block text-gray-700 font-medium mb-2">URL da Foto</label>
            <input type="url"
                    id="urlFoto"
                    formControlName="urlFoto"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500"
                    placeholder="Ex. https://example.com/foto.jpg"
                    name="urlFoto"
                    required/>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('urlFoto')">
                URL da Foto é obrigatória.
            </span>
        </div>
        <div class="mb-4">
            <label for="avaliacao" class="block text-gray-700 font-medium mb-2">Avaliação</label>
            <select
                    id="avaliacao"
                    formControlName="avaliacao"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500"
                    name="avaliacao"
                    required>
                <option [value]="">Selecione uma avaliação</option>
                <option [value]="1">1 - Ruim</option>
                <option [value]="2">2 - Regular</option>
                <option [value]="3">3 - Bom</option>
                <option [value]="4">4 - Muito Bom</option>
                <option [value]="5">5 - Excelente</option>
            </select>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('avaliacao')">
                Avaliação é obrigatória e deve estar entre 0 e 5.
            </span>
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Salvar
        </button>
    </form>
</div>
