<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Nova Categoria</h2>
    <hr class="mb-4">
    <form id="categoriaForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
        <div class="mb-4">
            <label for="nome" class="block text-gray-700 font-medium mb-2">Nome</label>
            <input type="text"
                    id="nome"
                    formControlName="nome" 
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500" 
                    placeholder="Ex. Restaurantes, Praias, Shoppings" 
                    name="nome" 
                    required/>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('nome')">
                Nome é obrigatório.
            </span>
        </div>
        <div class="mb-4">
            <label for="descricao" class="block text-gray-700 font-medium mb-2">Descrição</label>
            <textarea 
                    id="descricao"
                    rows="4" 
                    formControlName="descricao"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500" 
                    placeholder="Ex. Estabelecimentos de comércio local" 
                    name="descricao">
            </textarea>
            <span class="text-red-500 text-sm mt-1 block" *ngIf="isCampoInvalido('descricao')">
                Descrição é obrigatória.
            </span>
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Salvar
        </button>
    </form>
</div>
