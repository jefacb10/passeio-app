<!-- Filtro por categorias -->
 <form #frm="ngForm" (ngSubmit)="filtrar()">
     <div class="p-4 bg-white shadow-lg">
       <div class="flex flex-col md:flex-row items-center justify-center gap-4">
         <input type="text"
                [(ngModel)]="nomeFiltro" 
                name="nomeFiltro"
                placeholder="Pesquisar por nome..."
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring focus:ring-blue-500" />
             <select
                 [(ngModel)]="categoriaFiltro" name="categoriaFiltro"
                 class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:shadow-outline focus:ring focus:ring-blue-500">
                 <option value="-1">Todas as categorias</option>
                 <option *ngFor="let categoria of categoriasFiltro" [value]="categoria.nome">
                     {{ categoria.nome }}
                 </option>
             </select>

             <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                 Filtrar
             </button>

         </div>
     </div>
 </form>
<!-- Listagem de lugares -->
 <div id="lugaresList" class="p-4 grid grid-col-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="bg-white shadow rounded overflow-hidden" *ngFor="let lugar of lugares">
        <img [src]="lugar.urlFoto" alt="{{ lugar.nome }}" class="w-full h-48 object-cover" />
        <div class="p-4">
            <h3 class="text-lg font-semibold text-gray-700">{{ lugar.nome }}</h3>
            <p class="text-gray-600">{{ lugar.localizacao }}</p>
            <p class="text-gray-500 text-sm mt-2">Categoria: {{ lugar.categoria }}</p>
        </div>
        <div class="mt-2 mb-2 flex items-center">
            <span class="ml-2 text-yellow-400">{{ getTotalEstrelas(lugar) }}</span>
        </div>
    </div>
 </div>
